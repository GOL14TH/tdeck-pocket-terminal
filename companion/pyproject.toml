[build-system]

requires = ["setuptools>=68"]

build-backend = "setuptools.build_meta"

[project]

name = "tdeck-companion"

version = "0.2.1"

description = "Companion service for the LILYGO T-Deck Plus Pocket Terminal"

requires-python = ">=3.11"

dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "pydantic>=2.8", "PyYAML>=6", "Pillow>=11"]

[project.optional-dependencies]

desktop = ["vncdotool>=1.3"]

mesh = ["meshtastic>=2.7", "pypubsub>=4"]

[project.scripts]

tdeck-companion = "tdeck_companion.app:main"

tdeck-simulator = "tdeck_companion.simulator:main"

[tool.setuptools]

packages = ["tdeck_companion"]

[tool.setuptools.package-data]

tdeck_companion = ["simulator.html"]
